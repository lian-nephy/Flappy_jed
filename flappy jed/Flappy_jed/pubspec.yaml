name: flappy_bird_flutter
description: A Flappy Bird clone with menu, leaderboard, shop, achievements, power-ups, and customizable pipe/bird pictures.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  video_player: 2.9.2
  shared_preferences: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/background.mp4